<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" />
        <title>Task 7</title>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    <body>
        <script type="application/javascript">
            function createSearchForm() {
                const input = $('<input type="text">');
                const submit = $('<input type="submit">');
                const ul = $('<ul>');
                const form = $('<form>').append(input, submit);
                $('body').append(form, ul);
                form.on('submit', function(e) {
                    e.preventDefault();
                    ul.empty();
                    queryWikipedia(input.val());
                });
            }
            function addNewArticle(id, title, snippet) {
                const li = $('<li>');
                const p1 = $('<p>');
                const p2 = $('<p>');
                p1.append($('<span>').text(id + ' - '), $('<b>').text(title));
                p2.html(snippet);
                li.append(p1, p2);
                $('ul').append(li);
            }
            function queryWikipedia(search) {
                const data = {
                    action: 'query',
                    format: 'json',
                    list: 'search',
                    srsearch: search,
                    origin: '*'
                };
                $.get('https://en.wikipedia.org/w/api.php', data, function(response) {
                    if (response.query && response.query.search) {
                        response.query.search.forEach(function(item) {
                            addNewArticle(item.pageid, item.title, item.snippet);
                        });
                    }
                });
            }
            createSearchForm();
        </script>
    </body>
</html>
