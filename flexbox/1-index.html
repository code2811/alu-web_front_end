<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="1-styles.css">
  </head>
  <body>

      <div class="row">
        <div class="col-1">Logo</div>
        <div class="col-2">Nav</div>

    <main>
      <section class="section-services">
        <div class="row">
          <div class="col-1">Services</div>
        </div>
      </section>

      <section class="section-works">
        <div class="row">
          <div class="col-1">Works</div>
        </div>

      <section class="section-about-us">
        <div class="row">
          <div class="col-1">About Us</div>
        </div>

      <section class="section-latest-news">
        <div class="row">
          <div class="col-1">Latest News</div>
        </div>
      </section>

      <section class="section-testimonial">
        <div class="row">
          <div class="col-1">Testimonial</div>
        </div>
      </section>

      <section class="section-contact">
        <div class="row">

        </div>

    <footer>
      <div class="row">
        <div class="col-1">Footer</div>
      </div>
